name: "Workflow Dispatch Choices"
run-name: "Rodando - ${{github.event_name}}"
on:
  workflow_dispatch:
    inputs:
      minhastags:
        description: Selecione a tag
        type: choice
        options:
          - tag_1
          - tag_2
          - tag_3
        default: 'tag_3'
        required: true

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Comentario
        run: |
          echo "Você selecionou a ${{inputs.minhastags}}"